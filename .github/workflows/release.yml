name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    name: Release (macOS)
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Package release bundle
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          UPDATE_MANIFEST_PRIVATE_KEY_PEM: ${{ secrets.UPDATE_MANIFEST_PRIVATE_KEY_PEM }}
          UPDATE_MANIFEST_PUBLIC_KEY_B64: ${{ vars.UPDATE_MANIFEST_PUBLIC_KEY_B64 }}
          RELAY_BASE_URL: ${{ secrets.RELAY_PRODUCTION_URL }}
        run: bash script/build_and_run_codex.sh release

      - name: Resolve release assets
        id: release_assets
        run: |
          shopt -s nullglob
          zips=(release/${{ github.ref_name }}/Token-Cost-App-OC-Codex-${{ github.ref_name }}-macOS-*.zip)
          dmgs=(release/${{ github.ref_name }}/Token-Cost-App-OC-Codex-${{ github.ref_name }}-macOS-*.dmg)
          manifests=(release/${{ github.ref_name }}/Token-Cost-App-OC-Codex-${{ github.ref_name }}-macOS-*.update-manifest.json)
          if [[ ${#zips[@]} -ne 1 ]]; then
            echo "Expected exactly one release zip, found ${#zips[@]}" >&2
            printf '%s\n' "${zips[@]}" >&2
            exit 1
          fi
          if [[ ${#dmgs[@]} -ne 1 ]]; then
            echo "Expected exactly one release dmg, found ${#dmgs[@]}" >&2
            printf '%s\n' "${dmgs[@]}" >&2
            exit 1
          fi

          echo "zip_path=${zips[0]}" >> "$GITHUB_OUTPUT"
          echo "dmg_path=${dmgs[0]}" >> "$GITHUB_OUTPUT"
          if [[ ${#manifests[@]} -ge 1 ]]; then
            echo "manifest_path=${manifests[0]}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ steps.release_assets.outputs.zip_path }}
            ${{ steps.release_assets.outputs.dmg_path }}
            ${{ steps.release_assets.outputs.manifest_path }}

  android:
    name: Release (Android)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      # 注入 release 签名密钥（不写入仓库；key.properties/.jks 均被 .gitignore 忽略）
      - name: Inject Android release signing keys
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_B64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "ERROR: ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS secrets are required for a release build." >&2
            exit 1
          fi
          mkdir -p android/android/app/keystore
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > android/android/app/keystore/balance-monitor-release.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=keystore/balance-monitor-release.jks\n' \
            "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" \
            > android/android/key.properties
      - name: Build Android artifacts
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          RELAY_BASE_URL: ${{ secrets.RELAY_PRODUCTION_URL }}
        run: |
          if [ -z "$RELAY_BASE_URL" ]; then
            echo "ERROR: RELAY_PRODUCTION_URL is required for a release build." >&2
            exit 1
          fi
          cd android
          flutter pub get
          flutter analyze
          flutter test
          # 归档到 android/release/<tag>/，供上传
          mkdir -p "build/symbols/${{ github.ref_name }}"
          flutter build apk --release \
            --dart-define=RELAY_BASE_URL="$RELAY_BASE_URL" \
            --obfuscate \
            --split-debug-info="build/symbols/${{ github.ref_name }}"
          flutter build appbundle --release \
            --dart-define=RELAY_BASE_URL="$RELAY_BASE_URL" \
            --obfuscate \
            --split-debug-info="build/symbols/${{ github.ref_name }}"
          mkdir -p "release/${{ github.ref_name }}"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-${abi}-release.apk" \
              "release/${{ github.ref_name }}/balance-monitor-${{ github.ref_name }}-android-${abi}-release.apk" 2>/dev/null || true
          done
          cp "build/app/outputs/flutter-apk/app-release.apk" \
            "release/${{ github.ref_name }}/balance-monitor-${{ github.ref_name }}-android-universal-release.apk" 2>/dev/null || true
          cp "build/app/outputs/bundle/release/app-release.aab" \
            "release/${{ github.ref_name }}/balance-monitor-${{ github.ref_name }}-android-release.aab" 2>/dev/null || true
      - name: Upload Android assets to Release
        uses: softprops/action-gh-release@v2
        with:
          files: android/release/${{ github.ref_name }}/*
          fail_on_unmatched_files: false
