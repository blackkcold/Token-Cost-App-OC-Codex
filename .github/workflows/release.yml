name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_version:
        description: Existing semantic version tag to publish (for example v1.2.0)
        required: true
        type: string
      platform:
        description: Release job to run
        required: true
        default: all
        type: choice
        options:
          - all
          - macos

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_version || github.ref_name }}
  # Workspace-level App-Builds convention: exact-case directory inside github.workspace.
  # Layout: App-Builds/<timestamped-version>/<platform>,
  #         App-Builds/qa/<qa-pack>, App-Builds/latest/<platform>.
  APP_BUILDS_DIR: ${{ github.workspace }}/App-Builds

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      release_ts: ${{ steps.release_ts.outputs.release_ts }}
    steps:
      - name: Resolve release timestamp
        id: release_ts
        run: |
          release_ts="$(date -u +%Y%m%d-%H%M)"
          if [[ ! "$release_ts" =~ ^[0-9]{8}-[0-9]{4}$ ]]; then
            echo "Invalid release timestamp: $release_ts" >&2
            exit 1
          fi
          echo "release_ts=$release_ts" >> "$GITHUB_OUTPUT"

  release:
    name: Release (macOS)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'macos' }}
    needs: prepare
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Validate release tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}" >/dev/null

      - name: Package release bundle
        env:
          RELEASE_VERSION: ${{ env.RELEASE_TAG }}
          RELEASE_TS: ${{ needs.prepare.outputs.release_ts }}
          UPDATE_MANIFEST_PRIVATE_KEY_PEM: ${{ secrets.UPDATE_MANIFEST_PRIVATE_KEY_PEM }}
          UPDATE_MANIFEST_PUBLIC_KEY_B64: ${{ vars.UPDATE_MANIFEST_PUBLIC_KEY_B64 }}
          RELAY_BASE_URL: ${{ secrets.RELAY_PRODUCTION_URL }}
        run: bash script/build_and_run_codex.sh release

      - name: Resolve release assets
        id: release_assets
        env:
          RELEASE_TS: ${{ needs.prepare.outputs.release_ts }}
        run: |
          shopt -s nullglob
          base="$APP_BUILDS_DIR/${RELEASE_TAG}-${RELEASE_TS}/macos"
          zips=("$base"/Token-Cost-App-OC-Codex-*-macOS-*.zip)
          dmgs=("$base"/Token-Cost-App-OC-Codex-*-macOS-*.dmg)
          manifests=("$base"/Token-Cost-App-OC-Codex-*-macOS-*.update-manifest.json)
          if [[ ${#zips[@]} -ne 1 ]]; then
            echo "Expected exactly one release zip, found ${#zips[@]}" >&2
            printf '%s\n' "${zips[@]}" >&2
            exit 1
          fi
          if [[ ${#dmgs[@]} -ne 1 ]]; then
            echo "Expected exactly one release dmg, found ${#dmgs[@]}" >&2
            printf '%s\n' "${dmgs[@]}" >&2
            exit 1
          fi

          echo "zip_path=${zips[0]}" >> "$GITHUB_OUTPUT"
          echo "dmg_path=${dmgs[0]}" >> "$GITHUB_OUTPUT"
          if [[ ${#manifests[@]} -ge 1 ]]; then
            echo "manifest_path=${manifests[0]}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            ${{ steps.release_assets.outputs.zip_path }}
            ${{ steps.release_assets.outputs.dmg_path }}
            ${{ steps.release_assets.outputs.manifest_path }}
