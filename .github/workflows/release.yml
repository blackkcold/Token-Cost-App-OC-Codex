name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    name: Release
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Package release bundle
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: bash script/build_and_run_codex.sh release

      - name: Resolve release assets
        id: release_assets
        run: |
          shopt -s nullglob
          files=(release/${{ github.ref_name }}/Token-Cost-App-OC-Codex-${{ github.ref_name }}-macOS-*.zip)
          if [[ ${#files[@]} -ne 1 ]]; then
            echo "Expected exactly one release zip, found ${#files[@]}" >&2
            printf '%s\n' "${files[@]}" >&2
            exit 1
          fi

          echo "zip_path=${files[0]}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ${{ steps.release_assets.outputs.zip_path }}
