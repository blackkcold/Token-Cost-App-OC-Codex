name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: macos-26
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Checkout canonical Relay Contract
        uses: actions/checkout@v7.0.1
        with:
          repository: blackkcold/Token-Cost-Relay-Contract
          ref: main
          path: _relay-contract
      - name: Audit Public Repository Boundary
        run: python3 script/audit_public_boundary.py
      - name: Validate Relay Contract Snapshot
        env:
          RELAY_CONTRACT_ROOT: ${{ github.workspace }}/_relay-contract/test-vectors
        run: python3 script/check_relay_contract_snapshot.py
      - name: Check Developer Mode Banned Symbols
        run: bash script/check_developer_mode_banned_symbols.sh
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  android:
    name: Android (Flutter)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        working-directory: android
        run: flutter pub get
      - name: Analyze
        working-directory: android
        run: flutter analyze
      - name: Test
        working-directory: android
        run: flutter test
