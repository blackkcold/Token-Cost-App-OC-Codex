name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build (${{ matrix.runner }})
    strategy:
      matrix:
        runner: [macos-26, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Developer Mode Banned Symbols
        run: bash script/check_developer_mode_banned_symbols.sh
      - name: Build
        run: swift build
      - name: Test
        run: swift test
